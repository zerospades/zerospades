name: Android native integration (experimental)

# This is an integration build, not a playable release or a distribution channel.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android native toolchain
        run: sdkmanager --install 'platforms;android-35' 'ndk;28.2.13676358' 'cmake;3.31.5'
      - name: Check out pinned OpenAL source
        run: git submodule update --init --depth 1 openal-soft
      - name: Build pinned Android dependencies
        run: |
          set -eu
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin 4334d8b4c8916018600212ab4dd4bbdc343065d1
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mapfile -t ports < android/vcpkg/dependencies.txt
          "$RUNNER_TEMP/vcpkg/vcpkg" install "${ports[@]}" \
            --triplet arm64-android-api24 --overlay-triplets "$GITHUB_WORKSPACE/android/vcpkg/triplets" \
            --x-install-root="$RUNNER_TEMP/zs-deps" --clean-after-build
      - name: Obtain official r33 development assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download r33 --repo yvt/openspades-paks --pattern OpenSpadesDevPackage-r33.zip --dir "$RUNNER_TEMP"
      - name: Build experimental native debug APK
        working-directory: android
        env:
          ZEROSPADES_ANDROID_DEPS: ${{ runner.temp }}/zs-deps/arm64-android-api24
          ZEROSPADES_DEVPAK: ${{ runner.temp }}/OpenSpadesDevPackage-r33.zip
        run: gradle --no-daemon -PnativeGame=true assembleDebug
      # This deliberately does not publish a release; the build has not been
      # validated on a device and gameplay/HUD functionality is incomplete.
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-native-not-playtest-ready
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
